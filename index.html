<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 강의 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --panel:#fffdf9; --ink:#22211f; --muted:#7a766d; --line:#e4dfd4;
    --accent:#3b4cca; --accent-soft:#e8ebff; --rec:#d9413a; --new:#fff3c4; --ok:#2f8a57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:15px;line-height:1.6}
  header{display:flex;gap:10px;align-items:center;padding:14px 18px 8px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;margin-right:6px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--rec);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  header input{flex:1 1 180px;min-width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font:inherit;color:inherit}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:4px 18px 8px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:#c9c2b3}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary.rec{background:var(--rec);border-color:var(--rec)}
  button.ghost{background:transparent}
  button.danger{border-color:var(--rec);color:var(--rec)}
  select{font:inherit;font-size:14px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:inherit}
  label.inline{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  #status{font-size:13px;color:var(--muted);min-width:60px}
  .spacer{flex:1}
  .webonly{display:none}
  body.web .webonly{display:inline-flex}
  .materials{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 18px 12px;font-size:13px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;color:var(--ink);max-width:280px}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip small{color:var(--muted);white-space:nowrap}
  .chip button{border:0;background:transparent;padding:0 5px;font-size:15px;line-height:1;color:var(--muted)}
  .chip.loading{opacity:.6}
  .attach{padding:4px 11px;font-size:13px;border-style:dashed}
  body.drag main{outline:3px dashed var(--accent);outline-offset:-6px;border-radius:16px}
  main{flex:1;display:grid;grid-template-columns:minmax(280px,2fr) 3fr;gap:14px;padding:0 18px 18px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel h2{font-size:14px;margin:0;padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
  .panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
  .panel h2 .spacer{flex:1}
  .panel h2 button{padding:3px 9px;font-size:12px}
  #transcript{flex:1;overflow-y:auto;padding:13px 15px;font-size:14px;color:#4a4740;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
  #transcript .done{color:#9a958a}
  #transcript .pending{background:var(--new);border-radius:3px}
  #transcript .partial{color:var(--muted);font-style:italic}
  #transcript .empty,.notes-empty{color:var(--muted);font-style:normal}
  .manual{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  .manual textarea{flex:1;resize:vertical;min-height:42px;max-height:180px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
  #notesWrap{flex:1;overflow-y:auto;padding:6px 22px 24px}
  #notesEdit{flex:1;border:0;padding:16px 20px;font-family:ui-monospace,Menlo,monospace;font-size:13px;resize:none;background:#fff;display:none}
  .md h1{font-size:21px;margin:18px 0 8px}
  .md h2{font-size:18px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
  .md h3{font-size:16px;margin:18px 0 6px;color:var(--accent)}
  .md ul,.md ol{padding-left:22px;margin:6px 0}
  .md li{margin:3px 0}
  .md strong{background:linear-gradient(transparent 60%,var(--accent-soft) 60%)}
  .md table{border-collapse:collapse;margin:10px 0;font-size:14px;width:100%}
  .md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  .md th{background:#f3f0e8}
  .md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--muted)}
  .working{display:none;align-items:center;gap:8px;padding:8px 22px;font-size:13px;color:var(--accent);background:var(--accent-soft)}
  .working.show{display:flex}
  .spin{width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#2a2925;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:30}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .notice{margin:0 18px 10px;padding:9px 13px;border-radius:10px;background:#fdecea;color:#8a2a24;font-size:13px;display:none}
  .notice.show{display:block}
  .modal-bg{position:fixed;inset:0;background:rgba(30,28,24,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border-radius:16px;padding:22px;width:min(460px,100%);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal p{margin:4px 0 14px;font-size:13px;color:var(--muted)}
  .modal label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
  .modal input,.modal select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .modal a{color:var(--accent)}
  .lectures{display:flex;gap:6px;align-items:center;flex:1 1 100%;order:3}
  .lectures select{flex:1;min-width:0;max-width:420px;font-weight:500}
  .lectures button{padding:7px 11px}
  #lecCount{font-size:12px;color:var(--muted);white-space:nowrap}
  .important{margin:14px 0 6px;border:1.5px solid #f0b4a9;background:#fff6f3;border-radius:12px;padding:10px 14px 8px;display:none}
  .important.show{display:block}
  .important h4{margin:0 0 6px;font-size:14px;color:#a3321f;display:flex;align-items:center;gap:6px}
  .important ul{list-style:none;margin:0;padding:0}
  .important li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px dashed #f3d2ca;font-size:14.5px}
  .important li:first-child{border-top:0}
  .important li .txt{flex:1}
  .important li button{border:0;background:transparent;padding:0 4px;color:var(--muted);font-size:15px;line-height:1.4}
  .tag{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:2px;white-space:nowrap}
  .tag.시험{background:#d9413a;color:#fff}
  .tag.과제{background:#e8862a;color:#fff}
  .tag.공지{background:#3b4cca;color:#fff}
  .tag.강조{background:#7a4cc4;color:#fff}
  .imp-add{display:none;gap:6px;margin-top:8px}
  .imp-add.show{display:flex}
  .imp-add select,.imp-add input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .imp-add input{flex:1;min-width:0}
  .imp-add button{padding:5px 10px;font-size:13px}
  @media (max-width:760px){
    main{grid-template-columns:1fr;grid-template-rows:minmax(220px,38vh) minmax(320px,1fr)}
    header,.toolbar,.materials{padding-left:12px;padding-right:12px}
    main{padding:0 12px 12px}
    .toolbar .spacer{display:none}
    #lecCount{display:none}
    .lectures select{max-width:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="recDot"></span>실시간 강의 노트</div>
  <input id="course" placeholder="수업 이름 (예: 디자인과 문화)">
  <input id="topic" placeholder="오늘 주제 (선택, 예: 아르누보와 가우디)">
  <div class="lectures">
    <select id="lectureSel" title="저장된 강의"></select>
    <span id="lecCount"></span>
    <button id="newLecBtn" class="primary" style="background:#22211f;border-color:#22211f">+ 새 강의</button>
    <button id="delLecBtn" class="ghost" title="이 강의 삭제">🗑</button>
  </div>
</header>
<div class="toolbar">
  <button id="micBtn" class="primary" disabled>🎙 듣기 시작</button>
  <select id="lang" class="webonly" title="강의 언어">
    <option value="ko-KR">한국어</option>
    <option value="en-US">English</option>
    <option value="fr-FR">Français</option>
    <option value="zh-CN">中文</option>
  </select>
  <span id="status">준비 중…</span>
  <span class="spacer"></span>
  <label class="inline">자동 정리
    <select id="interval">
      <option value="60">1분마다</option>
      <option value="120" selected>2분마다</option>
      <option value="300">5분마다</option>
      <option value="0">끄기</option>
    </select>
  </label>
  <button id="organizeBtn" disabled>지금 정리</button>
  <button id="finalBtn" disabled>수업 끝 · 최종 정리</button>
  <button id="copyBtn">노트 복사</button>
  <button id="settingsBtn" class="ghost webonly" title="설정">⚙ 설정</button>
</div>
<div class="materials" id="materials">
  <span>📎 강의자료</span>
  <span id="chips"></span>
  <button class="attach" id="attachBtn">+ PDF · PPTX · DOCX · TXT 첨부</button>
  <input type="file" id="fileInput" multiple accept=".pdf,.pptx,.docx,.txt,.md,application/pdf" hidden>
</div>
<div class="notice" id="notice"></div>
<main>
  <section class="panel">
    <h2>받아쓰기 <small id="pendingInfo"></small></h2>
    <div id="transcript"></div>
    <div class="manual">
      <textarea id="manualText" placeholder="직접 메모하거나, 다른 앱(클로바노트 등)의 받아쓰기를 붙여넣기"></textarea>
      <button id="addManual">추가</button>
    </div>
  </section>
  <section class="panel">
    <h2>정리 노트 <small id="noteStatus"></small><span class="spacer"></span><button id="pinBtn" title="중요 항목 직접 추가">📌 추가</button><button id="editBtn">편집</button></h2>
    <div class="working" id="working"><span class="spin"></span><span id="workingText">정리 중…</span></div>
    <div id="notesWrap">
      <div class="important" id="important">
        <h4>📌 중요 — 시험 · 과제 · 공지</h4>
        <ul id="impList"></ul>
        <div class="imp-add" id="impAdd">
          <select id="impType"><option>시험</option><option>과제</option><option>공지</option><option>강조</option></select>
          <input id="impText" placeholder="예: 중간고사 범위 1~5장 (10/23)">
          <button id="impSave">추가</button>
        </div>
      </div>
      <article id="notes" class="md"></article>
    </div>
    <textarea id="notesEdit" spellcheck="false"></textarea>
  </section>
</main>

<div class="modal-bg" id="settingsModal">
  <div class="modal" role="dialog" aria-labelledby="setTitle">
    <h3 id="setTitle">AI 설정</h3>
    <p>이 사이트는 각자의 Claude API 키로 정리해요. 키는 <b>이 브라우저에만</b> 저장되고, Anthropic API로만 전송돼요. API 사용료는 Claude 구독과 별도로 청구돼요.</p>
    <label for="apiKey">Claude API 키</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    <p style="margin-top:6px">키 발급: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a></p>
    <label for="model">모델</label>
    <select id="model">
      <option value="claude-sonnet-5-5">Sonnet 5.5 — 추천 (정확도·속도 균형)</option>
      <option value="claude-haiku-5-5">Haiku 5.5 — 가장 저렴하고 빠름</option>
      <option value="claude-opus-5-5">Opus 5.5 — 가장 정교함 (비쌈)</option>
    </select>
    <div class="row">
      <button id="clearKey" class="ghost">키 지우기</button>
      <button id="closeSettings">닫기</button>
      <button id="saveSettings" class="primary">저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const OLD_KEY = 'lecture-notes-v1';
  const SKEY = 'lecture-notes-settings';
  const CUR_KEY = 'lecture-notes-current';
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  function blankLecture(course){
    const t = Date.now();
    return { id:newId(), createdAt:t, updatedAt:t, course:course||'', topic:'', segments:[], processed:0, notes:'', materials:[], lastPage:-1, important:[] };
  }
  function normalize(l){
    return Object.assign(blankLecture(), l, {
      segments: Array.isArray(l.segments)?l.segments:[], materials: Array.isArray(l.materials)?l.materials:[],
      important: Array.isArray(l.important)?l.important:[]
    });
  }
  let lectures = new Map();       // id -> lecture
  let state = blankLecture();     // current lecture
  let settings = { apiKey:'', model:'claude-sonnet-5-5', lang:'ko-KR', interval:'120' };
  let mode = 'pending';           // 'claude' | 'web'
  let speech = null, ai = null;   // engines
  let listening = false, partial = '';
  let busy = false, backoffUntil = 0, lastRun = Date.now(), editing = false;

  // ---------- storage: IndexedDB per lecture (falls back to memory) ----------
  const DB = (() => {
    let dbp = null;
    function open(){
      if(dbp) return dbp;
      dbp = new Promise((res, rej) => {
        try{
          const r = indexedDB.open('lecture-notes', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('lectures', {keyPath:'id'});
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        }catch(e){ rej(e); }
      });
      return dbp;
    }
    function tx(mode, fn){
      return open().then(db => new Promise((res, rej) => {
        const t = db.transaction('lectures', mode); const req = fn(t.objectStore('lectures'));
        t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      }));
    }
    return { all: () => tx('readonly', s => s.getAll()), put: o => tx('readwrite', s => s.put(o)), del: id => tx('readwrite', s => s.delete(id)) };
  })();
  let dbOk = true;
  const saveTimers = {};
  function saveLec(L){
    L = L || state;
    L.updatedAt = Date.now();
    clearTimeout(saveTimers[L.id]);
    saveTimers[L.id] = setTimeout(() => {
      if(!dbOk) return;
      DB.put(JSON.parse(JSON.stringify(L))).catch(e => {
        if(e && e.name === 'QuotaExceededError') toast('저장 공간이 부족해. 안 쓰는 강의를 지워줘');
        else { dbOk = false; notice('이 브라우저에서는 저장이 안 돼서 새로고침하면 사라져. 노트 복사로 따로 챙겨줘.'); }
      });
    }, 400);
  }
  const save = () => saveLec(state);
  function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }
  function setCurrent(id){ try{ localStorage.setItem(CUR_KEY, id); }catch(e){} }

  async function loadAll(){
    try{ const s = JSON.parse(localStorage.getItem(SKEY)||'null'); if(s && typeof s==='object') settings = Object.assign(settings, s); }catch(e){}
    let list = [];
    try{ list = (await DB.all()) || []; }catch(e){ dbOk = false; }
    list.forEach(l => lectures.set(l.id, normalize(l)));
    // 이전 버전(한 개만 저장하던 방식) 데이터 옮기기
    try{
      const old = JSON.parse(localStorage.getItem(OLD_KEY)||'null');
      if(old && (old.notes || (old.segments && old.segments.length))){
        const L = normalize(Object.assign(blankLecture(), old, {id:newId()}));
        lectures.set(L.id, L); saveLec(L); setCurrent(L.id);
      }
      if(old && dbOk) localStorage.removeItem(OLD_KEY);
    }catch(e){}
    let cur = null; try{ cur = localStorage.getItem(CUR_KEY); }catch(e){}
    if(cur && lectures.has(cur)) state = lectures.get(cur);
    else if(lectures.size) state = [...lectures.values()].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
    else { state = blankLecture(); lectures.set(state.id, state); }
    setCurrent(state.id);
  }

  // ---------- ui helpers ----------
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3400); }
  function notice(msg){ const n=$('notice'); if(msg){ n.textContent=msg; n.classList.add('show'); } else n.classList.remove('show'); }
  function nowStr(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
  function pendingText(){ return state.segments.slice(state.processed).join(' '); }

  function renderTranscript(){
    const box=$('transcript');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.textContent='';
    if(!state.segments.length && !partial){
      const e=document.createElement('span'); e.className='empty';
      e.textContent = speech ? '🎙 듣기 시작을 누르면 강의 내용이 여기에 실시간으로 적혀요.' : '여기에 받아쓴 내용이 쌓여요. 아래 칸에 직접 메모하거나 붙여넣을 수도 있어요.';
      box.appendChild(e);
    } else {
      const done=document.createElement('span'); done.className='done';
      done.textContent = state.segments.slice(0,state.processed).join(' ');
      const pend=document.createElement('span'); pend.className='pending';
      const p = pendingText();
      pend.textContent = p ? (state.processed? ' ':'') + p : '';
      const part=document.createElement('span'); part.className='partial';
      part.textContent = partial ? ' '+partial : '';
      box.append(done,pend,part);
    }
    if(nearBottom) box.scrollTop = box.scrollHeight;
    const n = pendingText().length;
    $('pendingInfo').textContent = n ? `정리 대기 ${n}자` : (state.segments.length ? '모두 정리됨' : '');
  }

  function mdToHtml(md){
    try{ if(window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md)); }catch(e){}
    const d=document.createElement('div'); d.textContent=md; return '<div style="white-space:pre-wrap">'+d.innerHTML+'</div>';
  }
  function renderNotes(){
    const el=$('notes');
    if(!state.notes.trim()){
      el.innerHTML = '<p class="notes-empty" style="margin-top:16px">아직 정리된 내용이 없어요. 받아쓰기가 쌓이면 자동으로 정리되고, <b>지금 정리</b>를 눌러 바로 정리할 수도 있어요. 강의자료를 첨부하면 용어와 맥락을 자료에 맞춰 정리해요.</p>';
    } else el.innerHTML = mdToHtml(state.notes);
    renderImportant();
  }

  // ---------- 중요 항목 (시험·과제·공지·강조) ----------
  const TYPES = ['시험','과제','공지','강조'];
  function renderImportant(){
    const box = $('important'), ul = $('impList');
    const items = state.important || [];
    ul.textContent = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');

  // relevance: character bigrams (works for Korean) + English words
  function grams(s){
    const set = new Set();
    for(const w of s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').split(' ')){
      if(!w) continue;
      if(/^[a-z0-9]+$/.test(w)){ if(w.length>=3) set.add(w); }

      else for(let i=0;i<w.length-1;i++) set.add(w.slice(i,i+2));

  function relevantMaterial(L, query, budget, track){
    const pages = allPages(L);

    if(total <= budget) picked = pages;
    else {
      const q = grams(query);
      const scored = pages.map(p=>{
        const g = grams(p.text); let hit=0; g.forEach(x=>{ if(q.has(x)) hit++; });
        let s = g.size ? hit/Math.sqrt(g.size) : 0;
        if(L.lastPage>=0){ const d = p.idx - L.lastPage; if(d>=0 && d<=3) s *= 1.25; }
        return {p, s};
      }).sort((a,b)=>b.s-a.s);
      picked=[]; let used=0;
      for(const {p,s} of scored){

    const items = [];
    (im ? im[1] : '').split('\n').forEach(line => {
      const m = line.match(/^\s*[-*•]?\s*\[(시험|과제|공지|강조)\]\s*(.+?)\s*$/);
      if(m) items.push({ type: m[1], text: m[2] });
    });
    return { notes: n ? stripFence(n[1]) : '', important: items };
  }

  // ---------- AI engines ----------
  function claudeAI(sample){
    return (prompt, {final, onProgress}) => sample(prompt, {
      modelTier: final ? 'complex' : 'default', cache:false,
      onText: ({text}) => onProgress && onProgress(text.length)
    });
  }
  function anthropicAI(){
    return async (prompt, {final, onProgress}) => {
      if(!settings.apiKey){ const e = new Error('API 키가 없어'); e.code='no_key'; throw e; }
      let res;
      try{
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method:'POST',
          headers:{
            'content-type':'application/json',
            'x-api-key': settings.apiKey,
            'anthropic-version':'2023-06-01',
            'anthropic-dangerous-direct-browser-access':'true'
          },
          body: JSON.stringify({ model: settings.model, max_tokens: final ? 4000 : 2000, messages:[{role:'user', content: prompt}] })
        });
      }catch(err){ const e = new Error('네트워크 오류'); e.code='network'; throw e; }
      if(!res.ok){
        let msg=''; try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(_){}
        const e = new Error(msg || ('HTTP '+res.status));
        e.code = res.status===401 ? 'bad_key' : (res.status===429 || res.status===529 || res.status===503) ? 'rate_limited' : res.status===400 && /credit|balance/i.test(msg) ? 'no_credit' : 'http';
        throw e;
      }
      const j = await res.json();
      const text = (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
      onProgress && onProgress(text.length);
      return { text, truncated: j.stop_reason === 'max_tokens' };
    };
  }

  // ---------- organize ----------
  async function organize(final){
    if(!ai || busy) return;
    if(Date.now() < backoffUntil && !final) return;
    const L = state;                       // 정리 도중 다른 강의로 바꿔도 원래 강의에 저장
    const upto = L.segments.length;
    const chunk = L.segments.slice(L.processed).join(' ');
    if(!final && !chunk) return;
    busy = true; updateButtons();
    $('working').classList.add('show');
    const label = t => { $('workingText').textContent = t; };
    label(final ? '최종 정리 만드는 중…' : '새 내용 정리 중…');
    let newImp = 0;
    const applyChunk = text => {
      const r = parseChunk(text);
      appendNotes(L, r.notes);
      newImp += addImportant(L, r.important);
      L.processed = upto;
    };
    try{
      if(final && chunk){
        const r0 = await ai(chunkPrompt(L, chunk), {final:false, onProgress:n=>label(`남은 내용 정리 중… ${n}자`)});
        applyChunk(r0.text); saveLec(L); if(L===state) renderTranscript();
      }
      if(final){
        const res = await ai(finalPrompt(L), {final:true, onProgress:n=>label('최종 정리 작성 중… '+n+'자')});
        appendNotes(L, stripFence(res.text));
        if(res.truncated) toast('정리가 길어서 일부가 잘렸을 수 있어');
      } else {
        const res = await ai(chunkPrompt(L, chunk), {final:false, onProgress:n=>label('정리 중… '+n+'자')});
        applyChunk(res.text);
        if(res.truncated) toast('정리가 길어서 일부가 잘렸을 수 있어');
      }
      saveLec(L);
      if(L===state){ $('noteStatus').textContent = nowStr() + ' 업데이트'; notice(''); }
      if(newImp) toast(`📌 중요 항목 ${newImp}개를 노트 맨 위에 고정했어`);
    }catch(e){
      const code = e && e.code;
      if(code === 'not_granted'){ ai = null; notice('AI 정리 권한이 거절돼서 자동 정리가 꺼졌어. 받아쓰기와 직접 메모는 계속 쓸 수 있어.'); }
      else if(code === 'no_key'){ notice('AI 정리를 하려면 ⚙ 설정에서 Claude API 키를 넣어줘.'); openSettings(); backoffUntil = Date.now()+60000; }
      else if(code === 'bad_key'){ notice('API 키가 맞지 않아. ⚙ 설정에서 키를 확인해줘.'); backoffUntil = Date.now()+300000; }
      else if(code === 'no_credit'){ notice('API 크레딧이 부족해. Anthropic 콘솔에서 결제 정보를 확인해줘.'); backoffUntil = Date.now()+300000; }
      else if(code === 'rate_limited'){ backoffUntil = Date.now()+120000; toast('요청이 많아서 2분 쉬었다가 다시 정리할게'); }
      else { backoffUntil = Date.now()+30000; toast('정리 실패: ' + ((e && e.message) || '알 수 없는 오류')); }
    }finally{
      busy = false; lastRun = Date.now();
      $('working').classList.remove('show');
      renderNotes(); renderTranscript(); renderLectureList(); updateButtons();
    }
  }
  function appendNotes(L, md){
    md = (md||'').trim();
    if(!md) return;
    L.notes = L.notes.trim() ? L.notes.trimEnd() + '\n\n' + md : md;
    if(editing && L===state) $('notesEdit').value = L.notes;
  }
  setInterval(()=>{
    if(!ai || busy) return;
    const sec = parseInt($('interval').value,10);
    const n = pendingText().length;
    if(!n) return;
    if(n > 2500 || (sec > 0 && Date.now() - lastRun >= sec*1000)) organize(false);
  }, 5000);

  // ---------- speech engines ----------
  function webSpeech(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR) return null;
    let rec = null, want = false, fails = 0;
    const h = {};
    const emit = (k,v) => h[k] && h[k](v);
    function make(){
      rec = new SR();
      rec.lang = settings.lang || 'ko-KR';
      rec.continuous = true; rec.interimResults = true;
      rec.onstart = () => { fails = 0; emit('state',{state:'listening'}); };
      rec.onresult = e => {
        let interim = '';
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r = e.results[i];
          if(r.isFinal) emit('final',{text:r[0].transcript}); else interim += r[0].transcript;
        }
        emit('partial',{text:interim});
      };
      rec.onerror = e => {
        if(e.error==='not-allowed' || e.error==='service-not-allowed'){ want=false; emit('state',{state:'idle',reason:'not_granted'}); }
        else if(e.error==='audio-capture'){ want=false; emit('state',{state:'idle',reason:'no_mic'}); }
      };
      rec.onend = () => {
        if(want && fails < 20){
          fails++;
          setTimeout(()=>{ if(!want) return; try{ make(); rec.start(); }catch(_){ emit('state',{state:'idle',reason:'error'}); } }, fails>3 ? 1000 : 150);
        } else if(want){ want=false; emit('state',{state:'idle',reason:'error'}); }
        else emit('state',{state:'idle',reason:'stopped'});
      };
    }
    return {
      start(){ want = true; fails = 0; make(); try{ rec.start(); return Promise.resolve(); }catch(e){ want=false; return Promise.reject(e); } },
      stop(){ want = false; try{ rec && rec.stop(); }catch(_){} return new Promise(r=>setTimeout(r,400)); },
      onPartial(f){ h.partial=f; }, onFinal(f){ h.final=f; }, onState(f){ h.state=f; }
    };
  }

  function onMicClick(){
    if(!speech) return;
    if(listening){
      speech.stop().catch(()=>{}).then(()=>{ if(pendingText() && ai) organize(false); });
      return;
    }
    speech.start().catch(err=>{
      const code = err && (err.code || err.message);
      if(code === 'not_granted'){ micDenied(); }
      else if(code === 'dismissed'){ toast('마이크 허용 창이 닫혔어. 다시 눌러줘'); }
      else toast('받아쓰기를 시작하지 못했어: ' + (code||''));
    });
  }
  function micDenied(){
    notice('마이크 사용이 거절됐어. 아래 칸에 직접 메모하거나 다른 앱 받아쓰기를 붙여넣어 줘.');
    speech = null; listening = false; updateButtons(); renderTranscript();
  }
  function setupSpeech(s){
    speech = s;
    if(!s){
      $('status').textContent = '받아쓰기 사용 불가';
      notice('이 브라우저에서는 실시간 받아쓰기를 쓸 수 없어. Chrome이나 Edge에서 열어줘. 그동안은 아래 칸에 직접 메모하거나 붙여넣으면 정리해 줄게.');
      updateButtons(); renderTranscript(); return;
    }
    s.onPartial(({text})=>{ partial = text||''; renderTranscript(); });
    s.onFinal(({text})=>{
      partial = '';
      const t = (text||'').trim();
      if(t){ state.segments.push(t); save(); }
      renderTranscript(); updateButtons();
    });
    s.onState(({state:st, reason})=>{
      listening = st === 'listening';
      if(listening) $('status').textContent = '듣는 중…';
      else {
        partial = '';
        if(reason === 'not_granted'){ micDenied(); return; }
        if(reason === 'no_mic'){ $('status').textContent='마이크 없음'; toast('마이크를 찾지 못했어'); }
        else if(reason === 'hidden'){ $('status').textContent = '화면을 벗어나서 멈췄어'; toast('다른 창으로 가서 받아쓰기가 멈췄어. 다시 시작을 눌러줘'); }
        else if(reason === 'error'){ $('status').textContent = '연결이 끊겨 멈춤'; toast('받아쓰기가 끊겼어. 다시 시작을 눌러줘'); }
        else if(reason && reason !== 'stopped' && reason !== 'viewer_stopped') $('status').textContent = '멈춤 (' + reason + ')';
        else $('status').textContent = '멈춤';
      }
      renderTranscript(); updateButtons();
    });
    $('status').textContent = '대기 중';
    updateButtons(); renderTranscript();
  }

  // ---------- settings modal (web mode) ----------
  function openSettings(){
    $('apiKey').value = settings.apiKey; $('model').value = settings.model;
    $('settingsModal').classList.add('show'); setTimeout(()=>$('apiKey').focus(), 50);
  }
  function closeSettings(){ $('settingsModal').classList.remove('show'); }
  $('settingsBtn').addEventListener('click', openSettings);
  $('closeSettings').addEventListener('click', closeSettings);
  $('settingsModal').addEventListener('click', e=>{ if(e.target.id==='settingsModal') closeSettings(); });
  $('saveSettings').addEventListener('click', ()=>{
    settings.apiKey = $('apiKey').value.trim(); settings.model = $('model').value;
    saveSettings(); closeSettings(); backoffUntil = 0;
    if(settings.apiKey){ notice(''); toast('저장했어'); } updateButtons();
  });
  $('clearKey').addEventListener('click', ()=>{ settings.apiKey=''; $('apiKey').value=''; saveSettings(); toast('키를 지웠어'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSettings(); });

  // ---------- wire up ----------
  $('interval').value = settings.interval || '120';
  $('lang').value = settings.lang || 'ko-KR';
  let listT;
  const relist = () => { clearTimeout(listT); listT = setTimeout(renderLectureList, 600); };
  $('course').addEventListener('input', e=>{ state.course=e.target.value; save(); relist(); });
  $('topic').addEventListener('input', e=>{ state.topic=e.target.value; save(); relist(); });
  $('lectureSel').addEventListener('change', e=>switchLecture(e.target.value));
  $('newLecBtn').addEventListener('click', async ()=>{
    // 아무것도 안 적힌 강의가 이미 있으면 그걸 씀
    const empty = [...lectures.values()].find(l => !l.notes && !l.segments.length && !l.materials.length && !l.important.length && l.id !== state.id);
    const L = empty || blankLecture(state.course);
    if(empty){ L.course = state.course; L.createdAt = Date.now(); }
    lectures.set(L.id, L); saveLec(L);
    if(state.id !== L.id && !state.notes && !state.segments.length && !state.materials.length && !state.important.length && !state.topic){
      lectures.delete(state.id); DB.del(state.id).catch(()=>{});
    }
    if(listening && speech) await speech.stop().catch(()=>{});
    state = L; setCurrent(L.id); renderAll();
    $('topic').focus();
    toast('새 강의를 만들었어. 오늘 주제를 적어줘');
  });
  let delArm = 0;
  $('delLecBtn').addEventListener('click', async ()=>{
    const b = $('delLecBtn');
    if(Date.now() - delArm > 3000){
      delArm = Date.now(); b.textContent = '정말 삭제? 한 번 더'; b.classList.add('danger');
      setTimeout(()=>{ b.textContent='🗑'; b.classList.remove('danger'); }, 3000);
      return;
    }
    delArm = 0; b.textContent = '🗑'; b.classList.remove('danger');
    if(listening && speech) await speech.stop().catch(()=>{});
    const gone = state;
    lectures.delete(gone.id); clearTimeout(saveTimers[gone.id]); DB.del(gone.id).catch(()=>{});
    const next = [...lectures.values()].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
    state = next || blankLecture(gone.course);
    if(!next) lectures.set(state.id, state);
    setCurrent(state.id); renderAll();
    toast(`'${gone.topic || mdDate(gone.createdAt)+' 강의'}'를 삭제했어`);
  });
  $('pinBtn').addEventListener('click', ()=>{
    const add = $('impAdd'); add.classList.toggle('show'); renderImportant();
    if(add.classList.contains('show')){ if(editing) $('editBtn').click(); $('notesWrap').scrollTop = 0; $('impText').focus(); }
  });
  $('impSave').addEventListener('click', ()=>{
    const t = $('impText').value.trim(); if(!t) return;
    addImportant(state, [{type:$('impType').value, text:t}]); save();
    $('impText').value=''; $('impAdd').classList.remove('show'); renderImportant(); renderLectureList();
  });
  $('impText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing) $('impSave').click(); });
  $('interval').addEventListener('change', e=>{ settings.interval=e.target.value; saveSettings(); });
  $('lang').addEventListener('change', e=>{ settings.lang=e.target.value; saveSettings(); });
  $('micBtn').addEventListener('click', onMicClick);
  $('organizeBtn').addEventListener('click', ()=>{ backoffUntil = 0; organize(false); });
  $('finalBtn').addEventListener('click', ()=>organize(true));

  $('attachBtn').addEventListener('click', ()=>$('fileInput').click());
  $('fileInput').addEventListener('change', e=>{ addFiles(e.target.files); e.target.value=''; });
  let dragDepth = 0;
  window.addEventListener('dragenter', e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')){ dragDepth++; document.body.classList.add('drag'); } });
  window.addEventListener('dragleave', ()=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) document.body.classList.remove('drag'); });
  window.addEventListener('dragover', e=>e.preventDefault());
  window.addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; document.body.classList.remove('drag'); if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  $('addManual').addEventListener('click', ()=>{
    const v = $('manualText').value.trim(); if(!v) return;
    state.segments.push(v); save(); $('manualText').value='';
    renderTranscript(); updateButtons();
  });
  $('manualText').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) $('addManual').click(); });

  $('editBtn').addEventListener('click', ()=>{
    editing = !editing;
    $('notesEdit').style.display = editing ? 'block' : 'none';
    $('notesWrap').style.display = editing ? 'none' : 'block';
    $('editBtn').textContent = editing ? '완료' : '편집';
    if(editing) $('notesEdit').value = state.notes;
    else { state.notes = $('notesEdit').value; save(); renderNotes(); updateButtons(); }
  });
  $('notesEdit').addEventListener('input', e=>{ state.notes = e.target.value; save(); });

  $('copyBtn').addEventListener('click', ()=>{
    if(!state.notes.trim() && !state.important.length){ toast('아직 복사할 노트가 없어'); return; }
    const head = state.course ? '# '+state.course+(state.topic?' — '+state.topic:'')+` (${mdDate(state.createdAt)})\n\n` : '';
    const imp = state.important.length ? '## 📌 중요\n' + state.important.map(i=>`- **[${i.type}]** ${i.text}`).join('\n') + '\n\n' : '';
    const text = head + imp + state.notes;
    navigator.clipboard.writeText(text).then(()=>toast('노트를 복사했어 (마크다운)'))
      .catch(()=>{
        if(!editing) $('editBtn').click();
        const ta=$('notesEdit'); ta.focus(); ta.select();
        toast('자동 복사가 막혀서 전체 선택해 뒀어. Ctrl/Cmd+C로 복사해줘');
      });
  });

  renderAll();
  loadAll().then(renderAll);

  // ---------- pick mode ----------
  function webMode(){
    mode = 'web'; document.body.classList.add('web');
    setupSpeech(webSpeech());
    ai = anthropicAI();
    if(!settings.apiKey) notice('AI 정리를 쓰려면 ⚙ 설정에서 본인 Claude API 키를 넣어줘. 키 없이도 받아쓰기는 돼.');
    updateButtons();
  }
  if(window.claude && typeof window.claude.use === 'function'){
    mode = 'claude';
    window.claude.use('dictation').then(setupSpeech).catch(()=>setupSpeech(null));
    window.claude.use('sample').then(s=>{
      ai = s ? claudeAI(s) : null;
      if(!s) notice('이 화면에서는 AI 정리를 쓸 수 없어.');
      updateButtons();
    }).catch(()=>{ ai=null; updateButtons(); });
  } else webMode();
})();
</script>
</body>
